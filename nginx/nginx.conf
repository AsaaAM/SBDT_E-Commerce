# ==============================================================================
# SISTEM BASIS DATA TERDISTRIBUSI (SBDT) - MARKETPLACE FURNITUR (GAYA IKEA)
# NGINX LOAD BALANCER & REVERSE PROXY CONFIGURATION
# ==============================================================================

upstream backend_cluster {
    # Round-Robin Load Balancing ke 2 Instance Backend Node.js
    server backend1:5000 max_fails=3 fail_timeout=10s;
    server backend2:5000 max_fails=3 fail_timeout=10s;
}

upstream frontend_app {
    server frontend:3000;
}

server {
    listen 80;
    server_name localhost;

    # Gzip Compression
    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml application/xml+rss text/javascript;

    # 1. Endpoint REST API (Load Balancing ke backend1 & backend2)
    location /api/ {
        proxy_pass http://backend_cluster;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Header untuk membuktikan Nginx Load Balancing round-robin
        add_header X-Upstream-Backend $upstream_addr always;
    }

    # 2. Endpoint Static Assets / Uploads
    location /uploads/ {
        proxy_pass http://backend_cluster;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        add_header X-Upstream-Backend $upstream_addr always;
    }

    # 3. Endpoint Health Check
    location /health {
        proxy_pass http://backend_cluster/health;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        add_header X-Upstream-Backend $upstream_addr always;
    }

    # 3. Storefront UI (Next.js Frontend)
    location / {
        proxy_pass http://frontend_app;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_cache_bypass $http_upgrade;
    }
}
